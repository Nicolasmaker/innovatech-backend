name: Deploy Frontend to AWS

on:
  push:
    branches: [ "deploy" ] # Se activa cuando haces push a la rama deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Login en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen a Docker Hub
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest

    - name: Desplegar en la instancia EC2 vía SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Bajar la nueva imagen
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
          
          # 2. Detener y borrar el contenedor viejo si existe
          docker stop innovatech-frontend-container || true
          docker rm innovatech-frontend-container || true
          
          # 3. Correr el nuevo contenedor
          docker run -d -p 80:80 --name innovatech-frontend-container ${{ secrets.DOCKERHUB_USERNAME }}/innovatech-frontend:latest
