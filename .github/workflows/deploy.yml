name: Backend CI/CD

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Build and push
      run: |
        docker build -t nicolasmaker/innovatech-backend:latest .
        docker push nicolasmaker/innovatech-backend:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.BACKEND_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo yum update -y
          sudo yum install -y docker
          sudo systemctl enable docker
          sudo systemctl start docker
          sudo usermod -a -G docker ec2-user
          sudo docker pull nicolasmaker/innovatech-backend:latest
          sudo docker stop backend || true
          sudo docker rm backend || true
          sudo docker run -d --name backend -p 3000:3000 nicolasmaker/innovatech-backend:latest
