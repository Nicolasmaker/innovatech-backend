name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Iniciar Sesion en Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry-type: public

      - name: Crear Repositorio ECR si no existe
        run: |
          aws ecr-public describe-repositories --repository-names innovatech-backend || aws ecr-public create-repository --repository-name innovatech-backend --region us-east-1

      - name: Construir y Subir Imagen Docker
        env:
          REGISTRY: public.ecr.aws/l9p0o1b7
          REPOSITORY: innovatech-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Desplegar en EC2 (Backend via Frontend Proxy)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FRONTEND_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.EC2_SSH_KEY }}" > backend.pem
            chmod 400 backend.pem
            ssh -o StrictHostKeyChecking=no -i backend.pem ec2-user@${{ secrets.BACKEND_IP }} "
              sudo yum install -y docker
              sudo systemctl start docker
              sudo usermod -aG docker ec2-user
              sudo docker pull public.ecr.aws/l9p0o1b7/innovatech-backend:latest
              sudo docker stop backend || true
              sudo docker rm backend || true
              sudo docker run -d --name backend -p 3000:3000 public.ecr.aws/l9p0o1b7/innovatech-backend:latest
            "

