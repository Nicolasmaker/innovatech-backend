name: Backend CI/CD

on:
  push:
    branches: [ "deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Build and push
      run: |
        docker build -t nicolasmaker/innovatech-backend:latest .
        docker push nicolasmaker/innovatech-backend:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.FRONTEND_IP }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        envs: secrets.BACKEND_IP,secrets.EC2_SSH_KEY
        script: |
          sudo yum install -y docker
          sudo service docker start
          sudo usermod -a -G docker ec2-user
          sudo docker pull nicolasmaker/innovatech-backend:latest
          sudo docker stop backend || true
          sudo docker rm backend || true
          sudo docker run -d --name backend -p 3000:3000 nicolasmaker/innovatech-backend:latest

